<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Latar belakang laut gelap dengan habitat laut">
  <title>CodeShark — Dark Underwater Habitat</title>
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b3a5a"/>
      <stop offset="0.35" stop-color="#072a45"/>
      <stop offset="0.7" stop-color="#051b2f"/>
      <stop offset="1" stop-color="#030d18"/>
    </linearGradient>
    <radialGradient id="surfaceGlow" cx="0.22" cy="0" r="0.8">
      <stop offset="0" stop-color="#3ea8d8" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#3ea8d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fe3ff" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#8fe3ff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#8fe3ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c3350"/>
      <stop offset="1" stop-color="#061a2c"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08263d"/>
      <stop offset="1" stop-color="#041321"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#051a2b"/>
      <stop offset="1" stop-color="#02080f"/>
    </linearGradient>
    <linearGradient id="kelp" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0b4a46"/>
      <stop offset="1" stop-color="#1fae95"/>
    </linearGradient>
    <linearGradient id="kelpDark" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#062a2c"/>
      <stop offset="1" stop-color="#0f6b62"/>
    </linearGradient>
    <radialGradient id="jelly" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#9ff0ff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#2ee6c8" stop-opacity="0.12"/>
    </radialGradient>
    <radialGradient id="jellyPink" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#ffb3e6" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#9a6bff" stop-opacity="0.12"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2ee6c8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2ee6c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.65"/>
    </radialGradient>
    <filter id="blur6" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>

    <!-- ikan kecil (menghadap kanan) -->
    <g id="fish">
      <path d="M0 0 C10 -9 26 -9 36 0 C26 9 10 9 0 0 Z"/>
      <path d="M-2 0 L-14 -8 L-12 0 L-14 8 Z"/>
    </g>
    <!-- ubur-ubur -->
    <g id="jellyBody">
      <path d="M-34 0 C-34 -40 34 -40 34 0 C20 6 -20 6 -34 0 Z"/>
    </g>
  </defs>

  <style>
    .sway   { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 7s ease-in-out infinite; }
    .sway2  { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 9s ease-in-out infinite reverse; }
    @keyframes sway { 0%,100% { transform: rotate(-3.5deg); } 50% { transform: rotate(3.5deg); } }
    .rays   { animation: rayShift 14s ease-in-out infinite alternate; transform-origin: 20% 0; }
    @keyframes rayShift { from { opacity: .55; transform: rotate(-1.2deg); } to { opacity: 1; transform: rotate(1.5deg); } }
    .swimR  { animation: swimR 70s linear infinite; }
    .swimR2 { animation: swimR 95s linear infinite; animation-delay: -40s; }
    .swimL  { animation: swimL 85s linear infinite; animation-delay: -20s; }
    @keyframes swimR { from { transform: translateX(-300px); } to { transform: translateX(2300px); } }
    @keyframes swimL { from { transform: translateX(2300px); } to { transform: translateX(-300px); } }
    .shark  { animation: swimL 120s linear infinite; animation-delay: -55s; }
    .bob    { animation: bob 6s ease-in-out infinite; }
    .bob2   { animation: bob 8s ease-in-out infinite reverse; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-22px); } }
    .pulse  { animation: pulse 3.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    .rise   { animation: rise 22s linear infinite; }
    @keyframes rise { from { transform: translateY(0); opacity: 0; } 10% { opacity: .7; } 90% { opacity: .7; } to { transform: translateY(-1200px); opacity: 0; } }
    .twinkle { animation: twinkle 4s ease-in-out infinite; }
    @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: .8; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- ===== AIR & CAHAYA ===== -->
  <rect width="1920" height="1080" fill="url(#water)"/>
  <rect width="1920" height="1080" fill="url(#surfaceGlow)"/>

  <g class="rays" filter="url(#blur6)">
    <polygon points="160,-40 300,-40 620,1080 340,1080" fill="url(#ray)"/>
    <polygon points="520,-40 620,-40 1000,1080 820,1080" fill="url(#ray)" opacity=".7"/>
    <polygon points="900,-40 960,-40 1320,1080 1170,1080" fill="url(#ray)" opacity=".5"/>
    <polygon points="1300,-40 1380,-40 1700,1080 1560,1080" fill="url(#ray)" opacity=".4"/>
  </g>

  <!-- ===== LATAR JAUH: karang & batu siluet ===== -->
  <g fill="url(#far)" opacity=".9">
    <path d="M0 760 C140 690 260 720 380 690 C520 650 620 720 760 700 C900 680 1000 620 1140 660 C1280 700 1400 650 1540 690 C1680 730 1800 690 1920 720 L1920 1080 L0 1080 Z"/>
    <!-- menara karang jauh -->
    <path d="M300 760 L330 560 L350 640 L380 520 L410 650 L430 760 Z"/>
    <path d="M1480 740 L1510 580 L1535 650 L1565 540 L1590 660 L1610 740 Z"/>
  </g>

  <!-- hiu siluet jauh -->
  <g class="shark" opacity=".5">
    <g transform="translate(0,360) scale(-1,1)" fill="#0a2c46">
      <path d="M0 0 C60 -34 170 -40 250 -16 C290 -6 320 -2 360 -30 C352 -8 350 8 362 30 C320 4 290 8 250 18 C170 42 60 36 0 0 Z"/>
      <path d="M150 -26 L190 -72 L205 -22 Z"/>
      <path d="M160 24 L150 56 L196 30 Z"/>
      <circle cx="40" cy="-4" r="3" fill="#2ee6c8" opacity=".6"/>
    </g>
  </g>

  <!-- sekolah ikan jauh -->
  <g fill="#1c6a8c" opacity=".35">
    <g class="swimR" style="transform-origin:0 0">
      <g transform="translate(0,300)">
        <use href="#fish" transform="scale(.6)"/><use href="#fish" transform="translate(60,24) scale(.5)"/>
        <use href="#fish" transform="translate(110,-18) scale(.55)"/><use href="#fish" transform="translate(150,28) scale(.45)"/>
        <use href="#fish" transform="translate(30,-34) scale(.5)"/><use href="#fish" transform="translate(190,-6) scale(.5)"/>
      </g>
    </g>
    <g class="swimR2">
      <g transform="translate(0,470)">
        <use href="#fish" transform="scale(.55)"/><use href="#fish" transform="translate(50,-20) scale(.5)"/>
        <use href="#fish" transform="translate(95,18) scale(.5)"/><use href="#fish" transform="translate(140,-8) scale(.45)"/>
      </g>
    </g>
  </g>
  <g fill="#2ee6c8" opacity=".28">
    <g class="swimL"><g transform="translate(0,610) scale(-1,1)">
      <use href="#fish" transform="scale(.7)"/><use href="#fish" transform="translate(70,26) scale(.6)"/>
      <use href="#fish" transform="translate(120,-22) scale(.65)"/><use href="#fish" transform="translate(170,16) scale(.55)"/>
    </g></g>
  </g>

  <!-- ===== LATAR TENGAH: kelp & karang ===== -->
  <g fill="url(#mid)">
    <path d="M0 860 C120 820 240 850 380 830 C520 810 640 860 800 840 C960 820 1100 790 1260 830 C1420 870 1560 830 1700 850 C1800 862 1860 840 1920 850 L1920 1080 L0 1080 Z"/>
  </g>

  <!-- kelp kiri -->
  <g fill="none" stroke-linecap="round">
    <path class="sway"  d="M90 900 C60 800 130 730 90 640 C60 570 120 520 100 450" stroke="url(#kelpDark)" stroke-width="16"/>
    <path class="sway2" d="M150 910 C190 820 120 760 160 680 C190 620 140 570 170 510" stroke="url(#kelp)" stroke-width="12" opacity=".8"/>
    <path class="sway"  d="M230 905 C200 840 260 790 230 730 C210 690 250 650 240 610" stroke="url(#kelpDark)" stroke-width="10"/>
  </g>
  <!-- kelp kanan -->
  <g fill="none" stroke-linecap="round">
    <path class="sway2" d="M1740 900 C1780 800 1700 730 1750 640 C1790 570 1730 510 1760 440" stroke="url(#kelpDark)" stroke-width="18"/>
    <path class="sway"  d="M1810 910 C1770 830 1840 770 1800 700 C1770 650 1820 600 1800 550" stroke="url(#kelp)" stroke-width="12" opacity=".8"/>
    <path class="sway2" d="M1670 905 C1700 850 1650 800 1680 750 C1700 710 1670 680 1685 640" stroke="url(#kelpDark)" stroke-width="10"/>
  </g>
  <!-- kelp tengah kecil -->
  <g fill="none" stroke-linecap="round" opacity=".75">
    <path class="sway"  d="M760 850 C740 800 790 770 765 720" stroke="url(#kelpDark)" stroke-width="8"/>
    <path class="sway2" d="M1130 840 C1155 790 1110 760 1135 710" stroke="url(#kelpDark)" stroke-width="8"/>
  </g>

  <!-- ubur-ubur bercahaya -->
  <g class="bob" transform="translate(1380 250)">
    <circle r="90" fill="url(#glow)" opacity=".5" filter="url(#blur6)"/>
    <g class="pulse">
      <use href="#jellyBody" fill="url(#jelly)" stroke="#9ff0ff" stroke-opacity=".5" stroke-width="1.5"/>
    </g>
    <g stroke="#9ff0ff" stroke-opacity=".5" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M-22 4 C-28 30 -16 46 -24 70"/><path d="M-8 6 C-12 34 -2 50 -8 84"/>
      <path d="M8 6 C14 34 2 50 10 80"/><path d="M22 4 C28 30 16 44 24 66"/>
    </g>
  </g>
  <g class="bob2" transform="translate(520 330) scale(.7)">
    <circle r="80" fill="#9a6bff" opacity=".18" filter="url(#blur6)"/>
    <g class="pulse"><use href="#jellyBody" fill="url(#jellyPink)" stroke="#ffb3e6" stroke-opacity=".5" stroke-width="2"/></g>
    <g stroke="#ffb3e6" stroke-opacity=".5" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M-22 4 C-30 32 -14 50 -24 78"/><path d="M0 6 C-6 36 6 52 -2 92"/><path d="M22 4 C30 32 14 48 24 74"/>
    </g>
  </g>
  <g class="bob" transform="translate(1650 520) scale(.45)" opacity=".7">
    <g class="pulse"><use href="#jellyBody" fill="url(#jelly)" stroke="#9ff0ff" stroke-opacity=".5" stroke-width="3"/></g>
    <g stroke="#9ff0ff" stroke-opacity=".5" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M-20 4 C-28 30 -12 48 -22 72"/><path d="M10 6 C16 34 2 50 12 80"/>
    </g>
  </g>

  <!-- karang tengah (kipas & tabung) -->
  <g opacity=".95">
    <g fill="#0d3b52">
      <path d="M470 870 C450 820 430 790 440 740 C455 780 470 800 480 760 C490 810 500 830 495 870 Z"/>
      <path d="M520 872 C505 830 510 800 530 770 C535 810 545 830 550 872 Z"/>
    </g>
    <!-- karang kipas -->
    <g stroke="#ff6b87" stroke-opacity=".55" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M980 870 L980 800 M980 830 L945 790 M980 830 L1015 790 M980 810 L960 765 M980 810 L1000 765 M945 790 L930 760 M1015 790 L1030 760"/>
    </g>
    <g stroke="#ffc247" stroke-opacity=".4" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M1330 868 L1330 810 M1330 840 L1300 800 M1330 840 L1360 800 M1330 820 L1315 780 M1330 820 L1345 780"/>
    </g>
    <!-- koral otak -->
    <g fill="#145a63">
      <ellipse cx="640" cy="868" rx="60" ry="30"/>
      <ellipse cx="1480" cy="872" rx="70" ry="32"/>
    </g>
    <g stroke="#2ee6c8" stroke-opacity=".3" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M600 866 C615 848 630 878 645 858 C660 840 672 870 684 856"/>
      <path d="M1440 870 C1455 852 1470 880 1485 862 C1500 846 1512 872 1524 860"/>
    </g>
    <!-- anemon bercahaya -->
    <g class="pulse" stroke="#2ee6c8" stroke-opacity=".7" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M840 880 L828 840 M850 880 L850 832 M860 880 L872 838 M870 882 L888 846 M830 882 L812 848"/>
    </g>
    <g fill="#2ee6c8" class="pulse">
      <circle cx="828" cy="838" r="4"/><circle cx="850" cy="830" r="4"/><circle cx="872" cy="836" r="4"/>
      <circle cx="888" cy="844" r="3.5"/><circle cx="812" cy="846" r="3.5"/>
    </g>
  </g>

  <!-- ikan depan (aksen warna) -->
  <g class="swimR" style="animation-duration:55s;animation-delay:-18s">
    <g transform="translate(0,720)" fill="#ffc247" opacity=".6"><use href="#fish"/></g>
  </g>
  <g class="swimL" style="animation-duration:62s;animation-delay:-8s">
    <g transform="translate(0,560) scale(-1,1)" fill="#45c6ff" opacity=".55"><use href="#fish" transform="scale(1.2)"/></g>
  </g>

  <!-- ===== LATAR DEPAN: dasar laut ===== -->
  <path d="M0 930 C160 900 320 940 520 920 C720 900 900 950 1100 930 C1300 910 1500 950 1700 925 C1800 915 1860 930 1920 925 L1920 1080 L0 1080 Z" fill="url(#near)"/>

  <!-- batu & kerang depan -->
  <g fill="#03111c">
    <path d="M60 1010 C90 950 190 940 240 975 C270 995 290 1010 300 1030 L40 1040 Z"/>
    <path d="M1580 1020 C1620 960 1740 950 1800 990 C1830 1010 1850 1025 1860 1040 L1560 1045 Z"/>
    <path d="M820 1030 C850 995 930 990 960 1020 L980 1045 L800 1048 Z"/>
  </g>
  <!-- rumput laut depan -->
  <g fill="none" stroke="#0b3a3d" stroke-width="7" stroke-linecap="round">
    <path class="sway"  d="M360 1010 C350 960 380 940 372 900"/>
    <path class="sway2" d="M380 1012 C396 965 372 945 388 905"/>
    <path class="sway"  d="M1230 1005 C1218 960 1250 940 1240 905"/>
    <path class="sway2" d="M1252 1008 C1268 962 1244 944 1260 908"/>
    <path class="sway"  d="M1420 1012 C1410 972 1436 954 1428 920"/>
  </g>
  <!-- bintang laut & kerang -->
  <g fill="#ff6b57" opacity=".5">
    <path d="M520 1022 l8 -20 l8 20 l20 -4 l-14 14 l12 18 l-22 -8 l-12 18 l-2 -22 l-22 -4 z" transform="scale(.6) translate(300 640)"/>
  </g>
  <g fill="#3a7690" opacity=".5">
    <path d="M1080 1030 C1100 1008 1140 1008 1160 1030 Z"/>
  </g>
  <!-- tulang rusuk kapal karam samar -->
  <g stroke="#0b2f45" stroke-width="10" stroke-linecap="round" fill="none" opacity=".8">
    <path d="M1000 1060 C1010 990 1040 960 1100 950"/><path d="M1060 1062 C1068 1000 1090 972 1140 962"/>
    <path d="M1120 1064 C1126 1008 1146 982 1190 974"/>
  </g>

  <!-- ===== PARTIKEL ===== -->
  <g fill="#bfeaff">
    <circle class="rise" cx="260" cy="1060" r="5" fill-opacity=".4"/>
    <circle class="rise" cx="640" cy="1060" r="8" fill-opacity=".3" style="animation-delay:-6s;animation-duration:26s"/>
    <circle class="rise" cx="1040" cy="1060" r="4" fill-opacity=".4" style="animation-delay:-12s"/>
    <circle class="rise" cx="1500" cy="1060" r="7" fill-opacity=".3" style="animation-delay:-3s;animation-duration:28s"/>
    <circle class="rise" cx="1760" cy="1060" r="5" fill-opacity=".4" style="animation-delay:-16s"/>
    <circle class="rise" cx="880" cy="1060" r="3" fill-opacity=".5" style="animation-delay:-9s;animation-duration:19s"/>
    <circle class="rise" cx="1250" cy="1060" r="6" fill-opacity=".3" style="animation-delay:-20s"/>
  </g>
  <g fill="#bfeaff">
    <circle class="twinkle" cx="200" cy="200" r="1.6"/><circle class="twinkle" cx="480" cy="520" r="1.4" style="animation-delay:-1s"/>
    <circle class="twinkle" cx="760" cy="180" r="1.8" style="animation-delay:-2s"/><circle class="twinkle" cx="1040" cy="420" r="1.4" style="animation-delay:-3s"/>
    <circle class="twinkle" cx="1240" cy="140" r="1.6" style="animation-delay:-.5s"/><circle class="twinkle" cx="1560" cy="380" r="1.8" style="animation-delay:-2.5s"/>
    <circle class="twinkle" cx="1820" cy="240" r="1.4" style="animation-delay:-1.5s"/><circle class="twinkle" cx="640" cy="700" r="1.6" style="animation-delay:-3.5s"/>
    <circle class="twinkle" cx="1380" cy="680" r="1.4" style="animation-delay:-.8s"/><circle class="twinkle" cx="320" cy="400" r="1.4" style="animation-delay:-2.2s"/>
  </g>

  <!-- redupkan area tengah agar kode tetap terbaca + vignette -->
  <rect x="360" y="120" width="1200" height="640" rx="40" fill="#030d18" opacity=".28" filter="url(#blur6)"/>
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
