# Konfigurasi Deployment Netlify untuk latihan.my.id (hub agregat + 2 sub-game)
# Struktur dist/: index.html (hub) + codingshark/index.html + codingtower/index.html
#
# ============================================================
# MODE DATA OTOMATIS — docs/MODE-LOKAL.md
# - Frontend VITE_DATA_MODE=auto: tes koneksi awal ke
#   /api/database-status (server mengetes TiDB Cloud + Aiven).
#   Terhubung -> cloud; gagal/belum dikonfigurasi -> lokal
#   (SQLite/localStorage). Redirect /api/* ke Functions AKTIF
#   agar tes itu bisa berjalan.
# - DATA_MODE=local di environment fungsi memaksa 503 mode-lokal.
# - Halaman /admin/ = diagnostik & tes koneksi khusus admin
#   (entry terpisah; pengujian berjalan di Functions).
# - /api/auth/* = Better Auth (MariaDB Layerbase, terpisah dari DB game).
# ============================================================

[build]
  command = "npm run build"
  publish = "dist"

# Public build settings only. Database secrets belong in the Netlify dashboard.
[build.environment]
  NODE_VERSION = "22"
  # Mode otomatis: browser mengetes koneksi cloud di awal.
  VITE_DATA_MODE = "auto"
  VITE_ADMIN_ENABLED = "false"
  VITE_SYNC_ENDPOINT = "/api/sync-progress"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["mysql2", "pg", "ioredis", "better-auth"]
  # Public CA added via GitHub; never place it in public/ or dist/.
  included_files = ["certs/tidb-ca-rozanhaisyam.pem"]

# (Blok /admin sengaja TANPA redirect di sini: file statis dist/admin/
# dilayani langsung, fallback SPA admin ada di bawah sebelum catch-all.)

# API (termasuk tes koneksi awal /api/database-status) must resolve
# before the SPA catch-all.
[[redirects]]
  from = "/api/admin-diagnostics"
  to = "/.netlify/functions/admin-diagnostics"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/*"
  to = "/.netlify/functions/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin-setup"
  to = "/.netlify/functions/admin-setup"
  status = 200
  force = true

[[redirects]]
  from = "/api/site-settings"
  to = "/.netlify/functions/site-settings"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin-settings"
  to = "/.netlify/functions/admin-settings"
  status = 200
  force = true

[[redirects]]
  from = "/api/database-status"
  to = "/.netlify/functions/database-status"
  status = 200
  force = true

[[redirects]]
  from = "/api/sync-progress"
  to = "/.netlify/functions/sync-progress"
  status = 200
  force = true

# Sub-game punya fallback SPA masing-masing (refresh di /codingshark/* tetap ke index sub-game)
[[redirects]]
  from = "/codingshark/*"
  to = "/codingshark/index.html"
  status = 200

[[redirects]]
  from = "/codingtower/*"
  to = "/codingtower/index.html"
  status = 200

[[redirects]]
  from = "/crossplatform/*"
  to = "/crossplatform/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# SPA Fallback Routing hub (agar refresh halaman tetap mengarah ke index.html)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache-Control untuk aset statis berekstensi hash
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
